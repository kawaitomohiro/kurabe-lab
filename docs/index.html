<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>くらべ方ラボ</title>
<meta name="description" content="5年算数 単位量あたりの大きさ・速さを、2本の数直線で図にかいて、式を立てて、何度でも練習できるアプリ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3f6; --paper:#fffef9; --card:#ffffff; --ink:#1d2433; --sub:#677184; --line:#d5dde6;
  --navy:#173a5e; --navy2:#22517f; --teal:#13a39a; --teal-soft:#dff5f2;
  --top:#2867d8; --top-soft:#e4edfd; --bot:#e2731c; --bot-soft:#fdeedf;
  --one:#ffd23f; --one-line:#d9a400; --one-soft:rgba(255,210,63,.22);
  --arrow:#1f9a5c; --ok:#1f9a5c; --ok-soft:#e1f5ea; --ng:#e04848; --ng-soft:#fde8e8;
  --grid:#e6edf5; --shadow:0 2px 0 rgba(23,58,94,.08), 0 6px 18px rgba(23,58,94,.07);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;font-size:18px;line-height:1.7;
  -webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;font-size:inherit}
.maru{font-family:"Zen Maru Gothic","BIZ UDPGothic",sans-serif}

/* ---------- 上の帯 ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.bar-in{max-width:900px;margin:0 auto;padding:8px 14px 0;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:22px;letter-spacing:.04em;white-space:nowrap}
.logo small{display:block;font-size:11px;font-weight:500;opacity:.75;letter-spacing:0;line-height:1}
.stat{margin-left:auto;font-size:13px;opacity:.9;text-align:right;line-height:1.3;white-space:nowrap}
.stat b{font-size:18px;color:var(--one)}
.fsbtn{background:rgba(255,255,255,.14);border-radius:10px;padding:4px 10px;font-size:14px;color:#fff;min-height:36px}
.tabs{max-width:900px;margin:0 auto;display:flex;gap:4px;padding:8px 10px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:92px;padding:9px 10px 10px;border-radius:12px 12px 0 0;background:rgba(255,255,255,.08);color:#d5e3f2;font-weight:700;font-size:15px;line-height:1.2;text-align:center}
.tab .n{display:block;font-size:11px;opacity:.75;font-weight:500}
.tab.on{background:var(--bg);color:var(--navy)}

/* ---------- 本体 ---------- */
main{max-width:900px;margin:0 auto;padding:14px 14px 120px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700;font-size:15px;min-height:42px;color:var(--sub)}
.chip.on{border-color:var(--navy2);background:var(--navy2);color:#fff}
.chip .lv{display:inline-block;background:var(--one);color:#3a2e00;border-radius:999px;font-size:12px;padding:0 7px;margin-right:6px}
.chip.on .lv{background:#fff;color:var(--navy2)}

/* 博士 */
.hk{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px}
.hk svg{flex:0 0 auto}
.bub{position:relative;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 18px;font-size:21px;line-height:1.65;font-weight:700;color:var(--ink);letter-spacing:.01em;flex:1}
body.big .bub{font-size:24px}
.bub:before{content:"";position:absolute;left:-9px;top:18px;width:14px;height:14px;background:var(--paper);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bub b{color:var(--navy2)}

/* 問題文 */
.prob{font-size:22px;line-height:1.85;font-weight:700;letter-spacing:.02em;margin:2px 0 6px}
body.big .prob{font-size:26px}
.prob .ic{font-size:26px;margin-right:6px}
.tok{display:inline-block;padding:0 6px;margin:0 1px;border-radius:8px;background:#fff6c9;border-bottom:3px solid #f2c200;line-height:1.35;font-size:1.08em}
.tok.tap{cursor:pointer;background:#f3f5f8;border-bottom-color:#b9c2cf}
.tok.got{background:#fff0a6;border-bottom-color:#e2b100;animation:pop .35s}
.tok.top{background:var(--top-soft);border-bottom-color:var(--top);color:var(--top)}
.tok.bot{background:var(--bot-soft);border-bottom-color:var(--bot);color:var(--bot)}
.askline{display:inline;background:linear-gradient(transparent 62%, rgba(19,163,154,.28) 62%)}
.qno{display:inline-block;background:var(--navy);color:#fff;border-radius:8px;font-size:14px;padding:1px 9px;margin-right:8px;vertical-align:3px}

/* 手順 */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 10px}
.st{font-size:14px;font-weight:700;border-radius:999px;padding:4px 12px;background:#e9eef3;color:#8a93a3}
.st.now{background:var(--navy2);color:#fff;box-shadow:0 0 0 3px rgba(34,81,127,.18)}
.st.done{background:var(--ok-soft);color:var(--ok)}
.st.done:before{content:"✓ "}

/* 数直線の箱（方眼ノート） */
.nlbox{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;border:2px solid var(--line);border-radius:14px;overflow:hidden;display:flex;justify-content:center;min-height:120px}
.nl{display:block;max-width:100%;height:auto;user-select:none;-webkit-user-select:none}
.nl text{font-family:"BIZ UDPGothic",sans-serif}
.nl .tap{cursor:pointer}
.nl .colg{transition:transform .9s cubic-bezier(.5,0,.2,1)}
.nl .slot.ready rect:first-child{stroke:var(--teal);stroke-width:3;animation:breathe 1.1s ease-in-out infinite}
.nl .slot.picked rect:first-child{fill:#d6f4f0;stroke:var(--teal);stroke-width:3.5;stroke-dasharray:none}
.nl .slot.picked .ring{animation:breathe 1s ease-in-out infinite}
.tray.waiting .cardb:not(.used){border-color:var(--teal);animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-3px);box-shadow:0 0 0 4px rgba(19,163,154,.25),0 3px 0 var(--teal)}}
.nl .slot.hint rect:first-child{stroke:var(--one-line);fill:#fff7cc;stroke-width:3.5;stroke-dasharray:none}
.nl .lab.hint rect{stroke:var(--one-line);fill:#fff7cc}
.nl .val.wrong rect,.nl .val.wrong circle{stroke:var(--ng)!important;stroke-width:4;fill:var(--ng-soft)}
.nl .val.wrong{animation:shake .45s}
.nl .lab.wrong rect{stroke:var(--ng);stroke-width:3.5;fill:var(--ng-soft)}
.nl .lab.wrong{animation:shake .45s}
.opt .bigexpr{font-size:inherit;margin:0}
.nl .arw.grow{animation:fadein .7s ease both}
@keyframes breathe{50%{stroke-opacity:.35}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{40%{transform:scale(1.15)}}
.nlnote{font-size:13px;color:var(--sub);margin:6px 2px 0}

/* 操作の場所 */
.ctrl{margin-top:12px}
.ask{font-weight:700;font-size:18px;margin:0 0 10px;color:var(--navy)}
.ask .sm{font-weight:500;font-size:14px;color:var(--sub);display:block}
.tray{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cardb{min-width:72px;min-height:56px;padding:6px 18px;border-radius:999px;background:var(--card);border:3px solid var(--line);font-size:24px;font-weight:700;box-shadow:0 3px 0 var(--line);transition:transform .12s}
.cardb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.cardb.one{background:var(--one);border-color:var(--one-line);box-shadow:0 3px 0 var(--one-line);border-radius:50%;min-width:58px;padding:6px}
.cardb.q{border-radius:10px;color:var(--navy2);border-color:var(--navy2)}
.cardb.sel{border-color:var(--teal);box-shadow:0 0 0 4px rgba(19,163,154,.3),0 3px 0 var(--teal);transform:translateY(-3px)}
.cardb.used{visibility:hidden}
.cardb.labc{font-size:18px;border-radius:14px;padding:8px 16px}
.cardb.labc .u{font-size:14px;color:var(--sub);font-weight:500}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,250px))}
.opts:has(.opt.wide){grid-template-columns:repeat(auto-fill,minmax(220px,1fr));max-width:860px}
.opt{text-align:center;white-space:nowrap;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:12px 14px;font-size:24px;font-weight:700;min-height:72px;box-shadow:0 3px 0 var(--line)}
.opt.wide{font-size:17px;line-height:1.55;text-align:left;white-space:normal;min-height:104px;display:flex;align-items:center}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.opt.ng{border-color:var(--ng);background:var(--ng-soft);color:var(--ng);box-shadow:0 3px 0 var(--ng);opacity:.75}
.opts.row{grid-template-columns:repeat(auto-fill,minmax(140px,210px))}
.opts.one{grid-template-columns:minmax(0,max-content)}
.opts.row .opt{text-align:center;font-size:24px;min-height:72px}
.opt.dir{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px}
.opt.dir .dv{font-size:26px;letter-spacing:.04em}
.opt.dir .dv .ar{color:var(--arrow);font-size:30px}
.opt.dir .dl{font-size:14px;color:var(--sub);font-weight:500}

/* 式 */
.expr{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:30px;font-weight:700;margin:6px 0 12px}
.expr .box{min-width:78px;height:58px;border:3px dashed #aab4c2;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;padding:0 10px;background:#fff;cursor:pointer}
.expr .box.op{min-width:58px}
.expr .box.f{border-style:solid;border-color:var(--navy2)}
.expr .box.ng{border-color:var(--ng);background:var(--ng-soft)}
.expr .eq{color:var(--sub)}
.bigexpr{font-size:30px;font-weight:700;margin:4px 0 8px;letter-spacing:.02em}
.bigexpr .q{display:inline-block;border:3px solid var(--navy2);border-radius:8px;min-width:44px;text-align:center;line-height:1.2;color:var(--navy2)}
.sub2{font-size:16px;color:var(--sub);font-weight:500}

/* キーパッド */
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin-top:10px}
.kp button{height:58px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-size:26px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.kp button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.kp .ent{grid-row:span 2;height:auto;background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 3px 0 #0b7a73;font-size:20px}
.kp .fn{font-size:17px;color:var(--sub)}
.kp [data-k="."]{font-size:40px;line-height:.6;padding-bottom:12px}
.ansrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:24px;font-weight:700}
.kpval{min-width:150px;height:60px;border:3px solid var(--navy2);border-radius:12px;background:#fff;display:inline-flex;align-items:center;justify-content:flex-end;padding:0 14px;font-size:30px;letter-spacing:.03em}
.kpval.empty{color:#b5bdc9}
.kpval.ng{border-color:var(--ng);background:var(--ng-soft);animation:shake .45s}

/* 返事 */
.fb{margin-top:12px;border-radius:14px;padding:0;font-size:17px;line-height:1.7}
.fb.show{padding:12px 18px;width:fit-content;max-width:100%;box-sizing:border-box}
.fb.ok{background:var(--ok-soft);color:#13693f;border:2px solid #9fdcbc}
.fb.ng{background:#fff4e5;color:#7a4300;border:2px solid #f5c98a}
.fb.info{background:var(--teal-soft);color:#0b5f59;border:2px solid #a6e2db}
.fb b{font-weight:700}
.notego{margin:12px 0 4px;border:3px dashed var(--teal);border-radius:16px;padding:14px 18px 16px;background:var(--paper)}
.notego .ng1{font-weight:900;font-size:22px;color:#0b6e68}
.notego ol{margin:8px 0 12px;padding-left:1.6em;font-size:19px;font-weight:700;line-height:1.75}
.notego .nggo{display:block;margin:0 auto;white-space:nowrap;padding:0 32px;min-height:58px;border-radius:14px;background:var(--teal);color:#fff;font-size:20px;font-weight:800;box-shadow:0 4px 0 #0b7a73}
.notego.done{width:fit-content;max-width:100%;box-sizing:border-box;border-style:solid;border-width:2px;background:#e9f7f5;padding:8px 14px;font-weight:700;font-size:16px;color:#0b6e68}
.next{display:block;margin:16px auto 0;min-width:260px;max-width:100%;padding:0 40px;min-height:62px;border-radius:16px;background:var(--navy2);color:#fff;font-size:22px;font-weight:700;box-shadow:0 4px 0 var(--navy)}
.next:active{transform:translateY(2px);box-shadow:0 2px 0 var(--navy)}
.btn2{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font-weight:700;font-size:15px;min-height:44px}

/* ノートの見本 */
.note{background:var(--paper);border:2px solid #e3dccb;border-radius:14px;padding:12px 14px;margin-top:12px;position:relative}
.note h4{margin:0 0 6px;font-size:15px;color:#8a6d1a}
.note .nlbox{border:none;background-color:transparent}
.note .ln{font-size:22px;font-weight:700;margin:4px 6px}
.note:not(:has(.nlbox)){width:fit-content;min-width:260px;max-width:100%;box-sizing:border-box;padding-right:28px}

/* 比べる表 */
.ctab{border-collapse:separate;border-spacing:0;margin:6px 0 4px;font-size:19px;min-width:280px}
.ctab th,.ctab td{padding:8px 14px;border-bottom:2px solid var(--line);text-align:right}
.ctab th{font-size:14px;color:var(--sub);font-weight:700}
.ctab td:first-child,.ctab th:first-child{text-align:left;font-weight:700}
.ctab .c1{color:var(--bot)} .ctab .c2{color:var(--top)} .ctab .c3{color:var(--arrow)}
.scr{overflow-x:auto}
.barch{margin-top:8px}
.barch .r{display:flex;align-items:center;gap:8px;margin:6px 0}
.barch .nm{width:84px;font-weight:700;font-size:16px;flex:0 0 auto}
.barch .b{height:30px;border-radius:8px;background:var(--top);min-width:4px;transition:width .8s}
.barch .v{font-weight:700;font-size:16px;white-space:nowrap}
.barch .r.best .b{background:var(--arrow)}

/* しくみ */
.slnav .cnt{display:none;font-weight:700;color:var(--sub);font-size:17px;white-space:nowrap}
.scene{background:var(--paper);border:2px solid var(--line);border-radius:14px;overflow:hidden}
.scene svg{display:block;width:100%;height:auto;max-height:calc(100vh - 120px)}
.scene .rab{transition:transform 1.4s cubic-bezier(.5,0,.2,1)}
.scene .fade{transition:opacity .6s}
.slnav{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.slnav .dots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.slnav .dots i{width:10px;height:10px;border-radius:50%;background:#cfd7e0}
.slnav .dots i.on{background:var(--navy2)}
.slnav button{min-height:54px;border-radius:14px;font-weight:700;font-size:19px;flex:0 0 auto;white-space:nowrap}
.slnav .pv{width:128px}
.slnav .nx{width:172px;line-height:1.2}
.slnav .pv{line-height:1.2}
.slnav .pv{background:var(--card);border:2px solid var(--line)}
.slnav .nx{background:var(--navy2);color:#fff}
.slnav button:disabled{opacity:.35}

/* うでだめし */
.tstart{text-align:center;padding:6px 0 4px}
.tstart .ts-h{font-size:26px;font-weight:900;color:var(--navy)}
.tstart .ts-sub{font-size:17px;color:var(--sub);font-weight:700;margin-top:2px}
.ts-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;max-width:720px;margin:16px auto 4px}
.ts-grid div{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:10px 4px 8px;font-size:15px;font-weight:700;line-height:1.3}
.ts-grid b{display:block;width:30px;height:30px;line-height:30px;margin:0 auto 6px;border-radius:50%;background:var(--navy2);color:#fff;font-size:15px}
.tstart .ts-best{font-size:16px;color:var(--sub);margin-top:6px}
.tstart .ts-best b{color:var(--navy2);font-size:20px}
.dots10{display:flex;gap:6px;margin:0 0 10px}
.dots10 i{flex:1;height:8px;border-radius:4px;background:#d7dee6}
.dots10 i.ok{background:var(--ok)} .dots10 i.ng{background:var(--ng)} .dots10 i.now{background:var(--navy2)}
.res{display:grid;gap:8px;max-width:560px;margin:0 auto}
.res .r{display:flex;align-items:center;gap:10px}
.res .nm{width:110px;font-weight:700;font-size:15px}
.res .bg{flex:1;height:18px;background:#e7ecf1;border-radius:9px;overflow:hidden}
.res .bg i{display:block;height:100%;background:var(--teal)}
.score{font-size:48px;font-weight:900;color:var(--navy2)}

.ladder{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.ladder .sp{border:3px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:700;background:#fff;font-size:17px}
.ladder .sp.on{border-color:var(--teal);background:var(--teal-soft)}
.ladder .ar{font-size:14px;color:var(--arrow);font-weight:700;text-align:center;line-height:1.2}

.foot{text-align:center;font-size:12px;color:var(--sub);margin-top:30px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--navy);color:#fff;border-radius:999px;padding:10px 22px;font-weight:700;transition:.3s;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:560px){
  body{font-size:17px}
  main{padding:10px 10px 100px}
  .card{padding:14px 12px}
  .prob{font-size:20px}
  .ts-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
  .ts-grid div{width:calc(25% - 5px);font-size:12px;padding:6px 1px;border-radius:10px;white-space:nowrap;box-sizing:border-box}
  .ts-grid b{width:24px;height:24px;line-height:24px;font-size:13px;margin-bottom:3px}
  .tstart .ts-h{font-size:22px}
  .tstart .ts-sub{font-size:15px}
  .next{min-width:220px;padding:0 24px}
  .opts{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .opts:has(.opt.wide){grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .opt{font-size:20px;padding:10px 8px}
  .opt.wide{font-size:16px;min-height:120px;padding:10px 12px}
  .opts.row{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .notego .ng1{font-size:20px}
  .notego ol{font-size:17px}
  .slnav{gap:8px}
  .slnav .pv{width:92px;font-size:16px;padding:0 4px}
  .slnav .dots{display:none}
  .slnav .cnt{display:block;flex:1;min-width:0;text-align:center;font-size:15px}
  .slnav .nx{width:136px;font-size:16px;padding:0 4px}
  .bub{font-size:18px;padding:10px 14px}
  body.big .bub{font-size:21px}
  body.big .prob{font-size:23px}
  .logo{font-size:19px}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;overflow:visible}
  .tab{min-width:0;font-size:15px;padding:6px 4px 7px;border-radius:10px}
  .expr{font-size:26px}
  .bigexpr{font-size:25px}
  .kp button{height:54px}
  .kp .fn{font-size:14px;line-height:1.2}
  .stat .lbl{display:none}
}

/* ---------- トップ画面 ---------- */
.splash{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 50% 40%,#22517f 0%,#173a5e 55%,#10294a 100%);color:#fff;transition:opacity .55s ease}
.splash.out{opacity:0;pointer-events:none}
html.sp-on,html.sp-on body{overflow:hidden}
.sp-in{text-align:center;width:min(560px,100%)}
.sp-hk{width:118px;height:118px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.25));animation:spPop .6s cubic-bezier(.3,1.6,.5,1) both}
.sp-t{font-size:clamp(42px,10vw,68px);font-weight:900;letter-spacing:.06em;margin-top:6px;line-height:1.2;animation:spUp .5s .15s both}
.sp-s{font-size:clamp(17px,4.4vw,22px);font-weight:700;color:#cfe0f0;margin-top:4px;animation:spUp .5s .3s both}
.sp-nl{width:100%;max-width:520px;margin:18px auto 6px;display:block}
.sp-ln{stroke-dasharray:480;stroke-dashoffset:480;animation:spDraw .6s .45s ease-out forwards}

.sp-pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:spPop .45s cubic-bezier(.3,1.6,.5,1) forwards}
.sp-d2{animation-delay:1.0s}.sp-d3{animation-delay:1.15s}.sp-d5{animation-delay:1.5s}
.sp-ar{stroke-dasharray:340;stroke-dashoffset:340;animation:spDraw .45s 1.2s ease-out forwards}
.sp-k{font-size:clamp(16px,4vw,20px);font-weight:700;color:#ffd23f;letter-spacing:.06em;animation:spUp .5s 1.5s both}
.sp-k span{color:#fff}
@keyframes spPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes spUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spDraw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.splash *{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}

  Runner.prototype.exprOptions = function () {

  Runner.prototype.exprBuild = function () {

    R.ex = [null, null, null];
    var nums = P.given.slice();
    function draw() {
      var used = {}; R.ex.forEach(function (x) { if (x) used[x] = 1; });
      var box = function (i) {
        var x = R.ex[i], t = '';
        if (x) t = (x === '×' || x === '÷') ? x : F(P[x]);
        return '<span class="box' + (i === 1 ? ' op' : '') + (x ? ' f' : '') + '" data-bx="' + i + '">' + t + '</span>';
      };
      R.eCtrl.innerHTML = '<div class="ask">□を求める式をつくろう<span class="sm">カードをタップすると左から入るよ。入れた所をタップでもどせる</span></div>' + R.exprHead() +
        '<div class="expr"><span>□ ＝</span>' + box(0) + box(1) + box(2) + '</div>' +
        '<div class="tray">' + nums.map(function (k) { return '<button class="cardb' + (used[k] ? ' used' : '') + '" data-n="' + k + '">' + F(P[k]) + '</button>'; }).join('') +
        ['×', '÷'].map(function (o) { return '<button class="cardb q" data-op="' + o + '">' + o + '</button>'; }).join('') + '</div>';
    }
    draw();
    R.eCtrl.onclick = function (e) {
      if (R.cur() !== 'expr' || R.exprDone) return;
      var bx = e.target.closest('[data-bx]');
      if (bx) { R.ex[+bx.getAttribute('data-bx')] = null; draw(); return; }
      var n = e.target.closest('[data-n]'), op = e.target.closest('[data-op]');
      if (n && !n.classList.contains('used')) { var i = R.ex[0] ? (R.ex[2] ? -1 : 2) : 0; if (i < 0) return; R.ex[i] = n.getAttribute('data-n'); }
      else if (op) R.ex[1] = op.getAttribute('data-op');
      else return;
      draw();
      if (R.ex[0] && R.ex[1] && R.ex[2]) {
        if (R.isRightExpr(R.ex[0], R.ex[1], R.ex[2])) { R.exprDone = true; R.fb('いい式！', 'ok'); R.later(function () { R.exprDone = false; R.next(); }, 700); }
        else {
          R.slip(); R.fb(exprMiss(P, R.ex[0], R.ex[1], R.ex[2]), 'ng'); R.flashArrow();
          $('.expr', R.eCtrl).querySelectorAll('.box').forEach(function (b) { b.classList.add('ng'); });
          if (R.miss >= 3) { var e2 = P.expr; R.exprDone = true; R.ex = [e2.lk, e2.op, e2.rk]; R.later(function () { draw(); R.fb('式はこうなるよ。図の矢印と見くらべてね。', 'info'); R.later(function () { R.exprDone = false; R.next(); }, 1800); }, 900); }
        }
      }
    };
  };

  /* ---- 答え ---- */
  Runner.prototype.st_ans = function () {
    var R = this, P = R.P;
    var e = P.expr;
    var lead = '<span>□ ＝ ' + exprText(P, e.l, e.op, e.r) + ' ＝</span>' + (P.ansPre ? '<span>' + P.ansPre + '</span>' : '');
    R.eCtrl.innerHTML = '<div class="ask">計算して答えを入れよう' + (P.round ? '<span class="sm">四しゃ五入して整数で</span>' : '<span class="sm">わり算は、ノートで筆算してもいいよ</span>') + '</div><div class="kpw"></div>';
    var kp = keypad($('.kpw', R.eCtrl), {
      lead: lead, unit: P.ansUnit,
      onEnter: function (v) {
        var x = parseFloat(v);
        if (Math.abs(x - P.ans) < 1e-9) { kp.lock = true; R.ansOK = R.firstTry; R.fb('せいかい！ 答えは <b>' + ansText(P, P.ans) + '</b>', 'ok'); R.later(function () { R.next(); }, 700); return; }
        R.slip(); kp.ng();
        var inv = P.kind === 'per' ? P.b / P.a : P.kind === 'count' ? P.u / P.a : P.u / P.b;
        var m;
        if (P.kind === 'total' && (Math.abs(x - P.u / P.b) < 0.01 || Math.abs(x - P.b / P.u) < 0.01)) m = '全体は「1あたり × いくつ分」。<b>かけ算</b>だよ。式は <b>' + exprText(P, e.l, e.op, e.r) + '</b>。';
        else if (P.kind !== 'total' && Math.abs(x - inv) < 0.01) m = 'わる数とわられる数が、反対になっていないかな？ 式は <b>' + exprText(P, e.l, e.op, e.r) + '</b>。';
        else if (P.round && Math.abs(x - P.a / P.b) < 0.6) m = '四しゃ五入して<b>整数</b>にしよう。';
        else m = '計算をもう一度たしかめよう。' + (e.op === '÷' ? '答えに、わる数をかけると、わられる数にもどるかな？' : '');
        if (R.miss >= 2) {
          kp.lock = true; kp.set(F(P.ans));
          R.fb('答えは <b>' + ansText(P, P.ans) + '</b>。ノートで ' + exprText(P, e.l, e.op, e.r) + ' の計算を見直そう。', 'ng');
          R.later(function () { R.next(); }, 2200); return;
        }
        R.fb(m, 'ng');
      }
    });
  };

  /* ---- おわり：ノートの見本 ---- */
  Runner.prototype.finish = function () {
    var R = this, P = R.P, cfg = R.cfg;
    R.eCtrl.innerHTML = ''; R.eCtrl.onclick = null; KP.active = null;
    var hasAns = cfg.steps.indexOf('ans') >= 0, hasExpr = cfg.steps.indexOf('expr') >= 0;
    if ((hasAns || hasExpr) && !cfg.noNote) {
      var e = P.expr;
      var note = el('div', 'note');
      var lines = '';
      if (P.kind === 'count') lines += '<div class="ln">' + F(P.u) + ' × □ ＝ ' + F(P.a) + '</div>';
      lines += '<div class="ln">□ ＝ ' + exprText(P, e.l, e.op, e.r) + (hasAns ? ' ＝ ' + F(P.ans) : '') + '</div>';
      if (hasAns) lines += '<div class="ln">答え　' + ansText(P, P.ans) + '</div>';
      note.innerHTML = '<h4>ノートにはこう書こう</h4><div class="nlbox"></div>' + lines;
      R.eEnd.appendChild(note);
      var S2 = { P: P, mode: 'show', final: true, flip: R.S.flip, lab: R.S.flip ? { top: 'B', bot: 'T' } : { top: 'T', bot: 'B' }, arrow: 3, prop: true, slot: {} };
      mountNL($('.nlbox', note), S2);
      if (!cfg.noDiagram) R.eNLwrap.style.display = 'none';
    }
    if (cfg.onDone) cfg.onDone(R.firstTry, R);
  };

  /* ---------- 「つぎへ」ボタン ---------- */
  // 選択肢の字がボタンからはみ出すときは、1列（はばは文字に合わせる）にする
  function fitOpts(box) {
    [].forEach.call(box.querySelectorAll('.opts'), function (o) {
      var over = [].some.call(o.querySelectorAll('.opt'), function (b) { return b.scrollWidth > b.clientWidth + 1; });
      if (over) o.classList.add('one');
    });
  }
  function nextBtn(host, label, fn) {
    var b = el('button', 'next', label || 'つぎの問題へ ▶');
    b.onclick = function () { b.disabled = true; fn(); };
    host.appendChild(b);
    return b;
  }
  function scrollTo(elm) {
    var r = elm.getBoundingClientRect();
    if (r.top < ($('.bar') ? $('.bar').offsetHeight : 90) || r.top > window.innerHeight * 0.5) window.scrollTo({ top: window.scrollY + r.top - ($('.bar') ? $('.bar').offsetHeight + 12 : 110), behavior: 'smooth' });
  }

  /* 比べる問題の表 */
  function cmpTable(C) {
    var c = C.ctx, col = c.cmp.col;
    var o = '<div class="scr"><table class="ctab"><tr><th></th><th>' + esc(col[0]) + '</th><th>' + esc(col[1]) + '</th>' + (C.showPer ? '<th>' + esc(c.perName) + (c.perAns.u && c.perName.indexOf('（') < 0 ? '（' + esc(c.perAns.u) + '）' : '') + '</th>' : '') + '</tr>';
    C.items.forEach(function (it) {
      var v0 = c.cmp.swapCol ? it.a : it.b, v1 = c.cmp.swapCol ? it.b : it.a;
      o += '<tr><td>' + esc(it.nm) + '</td><td class="c1">' + F(v0) + '</td><td class="c2">' + F(v1) + '</td>' + (C.showPer ? '<td class="c3">' + (it.done ? F(it.u) : '') + '</td>' : '') + '</tr>';
    });
    return o + '</table></div>';
  }
  function itemP(C, it) {
    var c = C.ctx, P = { type: 'single', ctx: c, kind: 'per', u: it.u, b: it.b, a: it.a, given: ['a', 'b'], ans: it.u, ansPre: c.perAns.pre, ansUnit: c.perAns.u, round: !!C.round };
    P.expr = { l: it.a, op: '÷', r: it.b, lk: 'a', rk: 'b' };
    P.segs = [{ t: it.nm + '：' }, { n: c.cmp.swapCol ? it.a : it.b, k: c.cmp.swapCol ? 'a' : 'b' }, { t: (c.cmp.swapCol ? c.top.u : c.bot.u) + '、' }, { n: c.cmp.swapCol ? it.b : it.a, k: c.cmp.swapCol ? 'b' : 'a' }, { t: (c.cmp.swapCol ? c.bot.u : c.top.u) + '　' + c.perName + 'は？' }];
    return P;
  }
  function barChart(C) {
    var mx = Math.max.apply(null, C.items.map(function (i) { return C.round ? i.u : i.u; }));
    return '<div class="barch">' + C.items.map(function (it) {
      return '<div class="r' + (it.nm === C.best ? ' best' : '') + '"><span class="nm">' + esc(it.nm) + '</span><span class="b" style="width:' + Math.max(4, it.u / mx * 62) + '%"></span><span class="v">' + F(it.u) + ' ' + esc(C.ctx.perAns.u) + '</span></div>';
    }).join('') + '</div>';
  }

  /* =====================================================
     比べる問題（1つずつ1あたりを出して、くらべる）
     cfg.mode: 'full'（1つめは図から）/ 'lite'（式と答え）/ 'quick'（判断だけ）
     ===================================================== */
  function CompareRunner(host, C, cfg) {
    var c = C.ctx, alive = claim(host);
    host.innerHTML = '';
    var head = el('div');
    host.appendChild(head);
    C.showPer = cfg.mode !== 'quick';
    function drawHead() {
      head.innerHTML = '<div class="prob">' + (cfg.qno ? '<span class="qno">' + cfg.qno + '</span>' : '') + '<span class="ic">' + c.icon + '</span>' + C.n + 'つの' + esc(c.cmp.what) + 'を比べます。<span class="askline">' + esc(C.q) + '</span></div>' +
        cmpTable(C) + (cfg.mode !== 'quick' ? '<div class="nlnote">「' + esc(c.perName) + '」をそれぞれ求めて比べよう。' + (C.round ? '（四しゃ五入して整数）' : '') + '</div>' : '');
    }
    drawHead();
    var body = el('div'); host.appendChild(body);
    var allFirst = true, idx = 0;
    function doItem() {
      if (idx >= C.items.length) return judge();
      var it = C.items[idx];
      var steps = cfg.mode === 'full' && idx === 0 ? ['label', 'place', 'arrow', 'expr', 'ans'] : ['expr', 'ans'];
      var box = el('div', 'card'); box.style.boxShadow = 'none'; box.style.border = '2px solid var(--line)';
      body.appendChild(box);
      new Runner(box, itemP(C, it), {
        steps: steps, exprMode: 'pick', banner: '<b>' + esc(it.nm) + '</b> の' + esc(c.perName), noNote: true, hideText: false,
        onDone: function (ok) {
          if (!alive()) return;
          if (!ok) allFirst = false;
          it.done = true; drawHead();
          box.querySelector('.nlbox') && (box.querySelector('.nlbox').parentNode.style.display = 'none');
          idx++; later(function () { if (!alive()) return; box.style.display = 'none'; doItem(); scrollTo(head); }, 700);
        }
      });
      scrollTo(box);
    }
    function judge() {
      var box = el('div'); body.appendChild(box);
      var big = c.cmp.better === 'big';
      box.innerHTML = '<div class="ask">' + esc(C.q) + '</div><div class="opts row">' + C.items.map(function (it) { return '<button class="opt" data-nm="' + esc(it.nm) + '">' + esc(it.nm) + '</button>'; }).join('') + '</div><div class="r2"></div><div class="fb"></div>';
      var fbx = $('.fb', box), step = 1;
      box.onclick = function (e) {
        var b = e.target.closest('[data-nm]');
        if (b && step === 1) {
          if (b.getAttribute('data-nm') === C.best) {
            b.classList.add('ok'); step = 2; fbx.className = 'fb'; fbx.innerHTML = '';
            var r1 = '「' + c.perName + '」が' + (big ? '大きい' : '小さい') + 'から', r2 = '「' + c.perName + '」が' + (big ? '小さい' : '大きい') + 'から';
            var r3 = c.top.n + 'が' + (C.n === 2 ? '' : 'いちばん') + adj(c.top.n, big) + 'から';
            var rs = GEN.shuffle([[r1, 1], [r2, 0], [r3, 0]]);
            $('.r2', box).innerHTML = '<div class="ask" style="margin-top:14px">理由はどれ？</div><div class="opts">' + rs.map(function (r) { return '<button class="opt wide" data-r="' + r[1] + '">' + esc(r[0]) + '</button>'; }).join('') + '</div>';
          } else { allFirst = false; b.classList.add('ng'); fbx.className = 'fb show ng'; fbx.innerHTML = (cfg.mode === 'quick' ? 'それぞれの「' + esc(c.perName) + '」をノートで計算して比べよう。' : '表の「' + esc(c.perName) + '」を見くらべよう。') + (big ? '大きい' : '小さい') + '方が' + esc(c.cmp.good) + 'よ。'; }
          return;
        }
        var r = e.target.closest('[data-r]');
        if (r && step === 2) {
          if (r.getAttribute('data-r') === '1') {
            r.classList.add('ok'); step = 3;
            fbx.className = 'fb show ok';
            fbx.innerHTML = '<b>' + esc(C.best) + '</b>。1あたりの大きさにそろえると、いくつでも一度に比べられるね。' + (c.inv ? '<br>「1ぴきあたりの面積」は<b>小さいほど混んでいる</b>。大小が反対になるから気をつけよう。' : '') + barChart(C);
            cfg.onDone && cfg.onDone(allFirst);
          } else { allFirst = false; r.classList.add('ng'); fbx.className = 'fb show ng'; fbx.innerHTML = (r.textContent.indexOf(c.top.n + 'が') === 0 ? '数だけでは決まらないよ。2つの量をそろえた「1あたり」で比べたね。' : '大きい・小さいを、もう一度表で見くらべよう。'); }
        }
      };
      scrollTo(box);
    }
    if (cfg.mode === 'quick') judge(); else doItem();
  }

  /* かたほうがそろっている比べ（計算なし） */
  function SameRunner(host, C, cfg) {
    var alive = claim(host);
    var c = C.ctx, big = c.cmp.better === 'big';
    var sameQ = C.sameBot ? c.bot : c.top, diffQ = C.sameBot ? c.top : c.bot;
    host.innerHTML = '<div class="prob"><span class="ic">' + c.icon + '</span>2つの' + esc(c.cmp.what) + 'を比べます。<span class="askline">' + esc(C.q) + '</span></div>' + cmpTable(C) +
      '<div class="ask" style="margin-top:12px">① 同じになっている（そろっている）のは？</div><div class="opts">' +
      GEN.shuffle([[c.bot, C.sameBot], [c.top, !C.sameBot]]).map(function (x) { return '<button class="opt wide" data-s="' + (x[1] ? 1 : 0) + '">' + esc(x[0].n) + 'がそろっている</button>'; }).join('') +
      '</div><div class="s2"></div><div class="fb"></div>';
    var fbx = $('.fb', host), step = 1, first = true;
    // 勝つ方：下がそろう→上の数で。上がそろう→下の数で（下が少ない方が1あたりは大きい）
    var winBig = C.sameBot ? big : !big; // 違う方の量が「多い」方が勝ちか
    host.onclick = function (e) {
      if (!alive()) return;
      var b = e.target.closest('[data-s]');
      if (b && step === 1) {
        if (b.getAttribute('data-s') === '1') {
          b.classList.add('ok'); step = 2; fbx.className = 'fb'; fbx.innerHTML = '';
          $('.s2', host).innerHTML = '<div class="ask" style="margin-top:14px">② ' + esc(C.q) + '</div><div class="opts row">' + C.items.map(function (it) { return '<button class="opt" data-nm="' + esc(it.nm) + '">' + esc(it.nm) + '</button>'; }).join('') + '</div>' +
            '<div class="ask" style="margin-top:14px">③ 理由は？</div><div class="opts">' + GEN.shuffle([
              [sameQ.n + 'が同じだから、' + diffQ.n + 'が' + adj(diffQ.n, winBig) + '方が' + (c.cmp.goodR || c.cmp.good), 1],
              [sameQ.n + 'が同じだから、' + diffQ.n + 'が' + adj(diffQ.n, !winBig) + '方が' + (c.cmp.goodR || c.cmp.good), 0],
              ['どちらもちがうから比べられない', 0]]).map(function (r) { return '<button class="opt wide" data-r="' + r[1] + '">' + esc(r[0]) + '</button>'; }).join('') + '</div>';
          var opts = $('.s2', host).querySelectorAll('.opts')[1]; opts.style.opacity = '.4'; opts.style.pointerEvents = 'none';
        } else { first = false; b.classList.add('ng'); fbx.className = 'fb show ng'; fbx.innerHTML = '表の数を、たてに見くらべてみよう。同じ数が入っている列はどれかな？'; }
        return;
      }
      var n = e.target.closest('[data-nm]');
      if (n && step === 2) {
        if (n.getAttribute('data-nm') === C.best) {
          n.classList.add('ok'); step = 3; fbx.className = 'fb'; var opts = $('.s2', host).querySelectorAll('.opts')[1]; opts.style.opacity = ''; opts.style.pointerEvents = '';
        } else { first = false; n.classList.add('ng'); fbx.className = 'fb show ng'; fbx.innerHTML = esc(sameQ.n) + 'が同じなら、' + esc(diffQ.n) + 'だけで比べられるよ。'; }
        return;
      }
      var r = e.target.closest('[data-r]');
      if (r && step === 3) {
        if (r.getAttribute('data-r') === '1') {
          r.classList.add('ok'); step = 4; fbx.className = 'fb show ok';
          fbx.innerHTML = '<b>' + esc(C.best) + '</b>。かたほうの量がそろっていれば、もうかたほうだけで比べられる。<br>では、<b>両方ちがう</b>ときは？ → レベル4では「1あたり」にそろえて比べるよ。';
          cfg.onDone && cfg.onDone(first);
        } else { first = false; r.classList.add('ng'); fbx.className = 'fb show ng'; fbx.innerHTML = r.getAttribute('data-r') === '0' && r.textContent.indexOf('比べられない') >= 0 ? 'かたほうがそろっているから比べられるよ。' : esc(diffQ.n) + 'が' + adj(diffQ.n, winBig) + '方が、' + esc(c.cmp.goodR || c.cmp.good) + 'ね。'; }
      }
    };
  }

  /* 2だんかい */
  function TwoRunner(host, T, cfg) {
    var alive = claim(host);
    host.innerHTML = '';
    var t = el('div', 'prob');
    t.innerHTML = (cfg.qno ? '<span class="qno">' + cfg.qno + '</span>' : '') + '<span class="ic">' + T.ctx.icon + '</span>' + T.segs.map(function (s) { return s.n != null ? '<span class="tok">' + F(s.n) + '</span>' : esc(s.t); }).join('');
    host.appendChild(t);
    var b1 = el('div'), b2 = el('div'); host.appendChild(b1); host.appendChild(b2);
    var c = T.ctx, all = true;

    var st2 = cfg.quick ? ['expr', 'ans'] : ['place', 'arrow', 'expr', 'ans'];
    new Runner(b1, T.s1, {
      steps: st1, exprMode: cfg.quick ? 'pick' : 'build', hideText: true, noNote: true, noDiagram: cfg.quick,
      banner: '① まず「' + esc(c.perName) + '」を求めよう',
      onDone: function (ok, R) {

        b1.querySelector('.ctrl').innerHTML = '<div class="bigexpr">① ' + esc(c.perName) + '：' + F(T.s1.a) + ' ÷ ' + F(T.s1.b) + ' ＝ ' + F(T.s1.u) + '（' + esc(c.perAns.u) + '）</div>';
        b1.querySelector('.steps').style.display = 'none';
        b1.querySelector('.fb').style.display = 'none';
        b1.querySelector('.nlbox') && (b1.querySelector('.nlbox').parentNode.style.display = 'none');
        later(function () {

            banner: '② 1あたりの <b>' + F(T.s1.u) + '</b> を使って、聞かれていることを求めよう',
            onDone: function (ok2) { if (!alive()) return; if (!ok2) all = false; cfg.onDone && cfg.onDone(all); }
          });
          scrollTo(b2);
        }, 500);
      }
    });
  }

  /* 単位をかえる */
  function timeRuler(Q, W) {
    W = Math.max(300, Math.min(700, W || 640));
    var H = 170, x0 = 30, x1 = W - 60, y1 = 60, y2 = 120;
    var frac = Q.toMin ? (Q.d % 1 || 1) : Q.mm / 60;
    var xm = x0 + (x1 - x0) * frac;
    var o = '<svg class="nl" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">';
    o += '<rect x="' + x0 + '" y="' + (y1 - 9) + '" width="' + (xm - x0) + '" height="18" rx="4" fill="var(--top-soft)"/>';
    o += '<rect x="' + x0 + '" y="' + (y2 - 9) + '" width="' + (xm - x0) + '" height="18" rx="4" fill="var(--bot-soft)"/>';
    o += '<line x1="' + x0 + '" y1="' + y1 + '" x2="' + x1 + '" y2="' + y1 + '" stroke="var(--top)" stroke-width="5"/>';
    o += '<line x1="' + x0 + '" y1="' + y2 + '" x2="' + x1 + '" y2="' + y2 + '" stroke="var(--bot)" stroke-width="5"/>';
    for (var i = 0; i <= 10; i++) {
      var x = x0 + (x1 - x0) * i / 10, big = i % 5 === 0;
      o += '<line x1="' + x + '" y1="' + (y1 - (big ? 12 : 7)) + '" x2="' + x + '" y2="' + (y1 + (big ? 12 : 7)) + '" stroke="var(--ink)" stroke-width="' + (big ? 3 : 1.5) + '"/>';
      o += '<line x1="' + x + '" y1="' + (y2 - (big ? 12 : 7)) + '" x2="' + x + '" y2="' + (y2 + (big ? 12 : 7)) + '" stroke="var(--ink)" stroke-width="' + (big ? 3 : 1.5) + '"/>';
      if (big || (i === 1 && W > 420)) {
        o += '<text x="' + x + '" y="' + (y1 - 20) + '" text-anchor="middle" font-size="18" font-weight="700">' + (i * 6) + '</text>';
        o += '<text x="' + x + '" y="' + (y2 + 34) + '" text-anchor="middle" font-size="18" font-weight="700">' + GEN.fmt(i / 10) + '</text>';
      }

  YonRunner.prototype.checkPlace = function () {

    var info = el('div', 'nlnote'); main.appendChild(info);

      r.push([x, y]);

  }
  function evenPos(px, py, w, h, n, cell) {

    for (var k = 0; k < n; k++) { var c = k % cols, rr = Math.floor(k / cols), inRow = Math.min(cols, n - rr * cols); r.push([px + W * (c + 0.5) / inRow, py + 10 + (H - 14) * (rr + 0.5) / rows]); }

  }
  function svgWrap(vb, inner) { return '<svg viewBox="' + vb + '" role="img">' + inner + '</svg>'; }

  var SHIKUMI = {

      function tiles(px, py, w, h, n, reps, cols, seed, c) {

        { say: '3つのうさぎ小屋があるよ。<b>いちばん混んでいるのはどれ</b>かな？　1マスが1㎡だよ。', draw: function () { return three({}); } },
        { say: '<b>AとB</b>は、面積が同じ4㎡。うさぎの数が多い<b>A</b>の方が混んでいるね。', draw: function () { return three({ C: 1 }); } },
        { say: '<b>BとC</b>は、うさぎの数が同じ5ひき。面積がせまい<b>C</b>の方が混んでいる。', draw: function () { return three({ A: 1 }); } },
        { say: 'では<b>AとC</b>は？　面積もうさぎの数も、どちらもちがう…。<b>数だけ</b>や<b>広さだけ</b>では決められないね。', draw: function () { return three({ B: 1 }); } },
        { say: '<b>面積をそろえて</b>みよう。Aを3つ、Cを4つならべると、どちらも<b>12㎡</b>。<br>Aは 6×3＝<b>18ひき</b>、Cは 5×4＝<b>20ひき</b>。→ <b>C</b>の方が混んでいる！', draw: function () {
          if (NARROW) return svgWrap('0 0 300 345', tiles(12, 8, 2, 2, 6, 3, 3, 20, 46) + '<text x="150" y="134" text-anchor="middle" font-size="23" font-weight="700">A×3　12㎡に<tspan fill="var(--top)">18</tspan>ひき</text>' +
            tiles(15, 160, 3, 1, 5, 4, 2, 40, 45) + '<text x="150" y="285" text-anchor="middle" font-size="23" font-weight="700">C×4　12㎡に<tspan fill="var(--ng)">20</tspan>ひき</text>');
          return svgWrap('0 0 600 180', tiles(12, 16, 2, 2, 6, 3, 3, 20, 46) + '<text x="150" y="150" text-anchor="middle" font-size="24" font-weight="700">A×3　12㎡に<tspan fill="var(--top)">18</tspan>ひき</text>' +
            tiles(318, 16, 3, 1, 5, 4, 2, 40, 45) + '<text x="453" y="150" text-anchor="middle" font-size="24" font-weight="700">C×4　12㎡に<tspan fill="var(--ng)">20</tspan>ひき</text>');
        } },
        { say: 'でも、毎回そろえる数を考えるのは大変。そこで<b>1㎡にそろえる</b>。うさぎが小屋全体に<b>ならして</b>いると考えるよ。', draw: function () {
          return svgWrap(AC.vb(), pen(AC.ax(), AC.ay(), 2, 2, 6, cell, { id: 'A', seed: 3, label: 'A', sub: '4㎡に6ひき' }) + pen(AC.cx(), AC.cy(), 3, 1, 5, cell, { id: 'C', seed: 11, label: 'C', sub: '3㎡に5ひき' }));
        }, after: function (sc) {

          var tmp = document.createElement('div'); tmp.innerHTML = even;
          var to = tmp.querySelectorAll('.rab'), from = sc.querySelectorAll('.rab');
          later(function () { from.forEach(function (g, k) { if (to[k]) g.style.transform = to[k].style.transform; }); }, 500);

        { say: '1㎡あたりのうさぎの数は、<br>A：6 ÷ 4 ＝ <b>1.5</b>（ひき）　C：5 ÷ 3 ＝ <b>1.66…</b>（ひき）<br>1㎡あたりで比べても、<b>C</b>が混んでいる。', draw: function () {

    haya: function (card) {

      function sec() {

        } },
